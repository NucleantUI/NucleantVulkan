# Releases NucleantVulkan, run by hand with the version to release:
#
#   1. check     the version is X.Y.Z;
#   2. deps      builds and tests every platform's libraries from source
#                (build-deps.yml), the archives as artifacts;
#   3. release   makes the release commit on top of master, the commit it ran
#                on:
#                  * Package.swift's `releasedVulkan` filled in (replacing the
#                    previous release's): each archive's URL on this release
#                    and its checksum (from `swift package compute-checksum`,
#                    which a url binary target must carry), which make them
#                    binary targets that SwiftPM downloads only for the
#                    platform and architecture being built;
#                  * no Dependencies/: the libraries are the release's.
#                Then tags it with the version, publishes the GitHub release
#                with the archives, and pushes the commit to master — last,
#                so master never names archives that are not up yet. Master
#                and the tag then build from the same archives. A version
#                already released is re-released: its release and tag are
#                replaced — only now, with everything built, tested and
#                checked;
#   4. verify    a new package that depends on the release by its version and
#                builds and runs against it on Linux, in Swift's image with
#                nothing installed: the URLs, checksums and manifest as a
#                consumer gets them, and the libraries an app ships.
#
# The tag and master are pushed with GITHUB_TOKEN, so they start no workflow.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (the tag)
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Version
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$TAG" =~ $semver ]] || { echo "::error::version $TAG is not X.Y.Z"; exit 1; }
          # The release commit goes onto master.
          [ "$GITHUB_REF" = refs/heads/master ] || { echo "::error::run it on master, not $GITHUB_REF"; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG is released already: it will be re-released"
          fi

  deps:
    needs: check
    uses: ./.github/workflows/build-deps.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: deps
    runs-on: ubuntu-24.04
    # Swift's image, to evaluate the release commit's manifest before it is
    # published.
    container: swift:6.3.3-noble
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUCLEANT_LOCAL_DEV: "0"
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: apt-get update && apt-get install -y gh python3
      - uses: actions/download-artifact@v8
        with:
          pattern: vulkan-*
          path: dist
          merge-multiple: true
      # Every archive Package.swift names: a missing one would leave its
      # binary target pointing at Artifacts/, which a consumer has not got.
      - name: All the archives
        run: |
          ls -l dist
          for archive in \
            MoltenVK.xcframework.zip MoltenVK_lib.xcframework.zip \
            wgpu_native.xcframework.zip wgpu_native_framework.xcframework.zip \
            shaderc.xcframework.zip spirv-cross.xcframework.zip \
            vulkan-loader-linux-x86_64.artifactbundle.zip vulkan-loader-linux-aarch64.artifactbundle.zip \
            wgpu_native-linux-x86_64.artifactbundle.zip wgpu_native-linux-aarch64.artifactbundle.zip \
            shaderc-linux-x86_64.artifactbundle.zip shaderc-linux-aarch64.artifactbundle.zip \
            spirv-cross-linux-x86_64.artifactbundle.zip spirv-cross-linux-aarch64.artifactbundle.zip \
            vulkan-loader-windows-x86_64.artifactbundle.zip wgpu_native-windows-x86_64.artifactbundle.zip \
            shaderc-windows-x86_64.artifactbundle.zip spirv-cross-windows-x86_64.artifactbundle.zip \
            wgpu_native-android-arm64-v8a.artifactbundle.zip wgpu_native-android-x86_64.artifactbundle.zip \
            shaderc-android-arm64-v8a.artifactbundle.zip shaderc-android-x86_64.artifactbundle.zip \
            spirv-cross-android-arm64-v8a.artifactbundle.zip spirv-cross-android-x86_64.artifactbundle.zip \
            shaderc-wasm32.artifactbundle.zip spirv-cross-wasm32.artifactbundle.zip
          do
            [ -f "dist/$archive" ] || { echo "::error::no $archive"; exit 1; }
          done
      - name: Release commit
        run: |
          python3 - <<'EOF'
          import os, pathlib, re, subprocess

          def checksum(path):
              return subprocess.run(["swift", "package", "compute-checksum", str(path)],
                                    check=True, capture_output=True, text=True).stdout.strip()

          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}"
          entries = "".join(
              f'    "{path.name}": (\n'
              f'        url: "{base}/{path.name}",\n'
              f'        checksum: "{checksum(path)}"\n'
              f'    ),\n'
              for path in sorted(pathlib.Path("dist").glob("*.zip"))
          )
          manifest = pathlib.Path("Package.swift")
          text = manifest.read_text()

          # The previous release's entries, or none before the first.
          declaration = re.compile(
              r"let releasedVulkan: \[String: \(url: String, checksum: String\)\] = (\[:\]|\[\n.*?\n\])\n",
              re.DOTALL)
          assert len(declaration.findall(text)) == 1, "Package.swift has no releasedVulkan to fill in"
          text = declaration.sub(
              lambda _: "let releasedVulkan: [String: (url: String, checksum: String)] = [\n" + entries + "]\n", text)

          manifest.write_text(text)
          EOF
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --ignore-unmatch Dependencies
          git add Package.swift
          git commit -q -m "Release $TAG: libraries from the release's archives"
      # The manifest as a consumer evaluates it (no sibling NucleantGeometry
      # here, so not local): it must evaluate, without unsafeFlags, and with
      # every dependency by version, as SwiftPM requires of a package
      # depended on by version.
      - name: Release manifest
        run: |
          # As Linux, each Android ABI and wasm evaluate it (Apple's can only
          # be evaluated on a Mac, Windows' on Windows; their archive names
          # are fixed).
          swift package dump-package > linux.json
          ANDROID_BUILD=1 SWIFT_ANDROID_ABI=arm64-v8a swift package dump-package > android-arm64-v8a.json
          ANDROID_BUILD=1 SWIFT_ANDROID_ABI=x86_64 swift package dump-package > android-x86_64.json
          WASM_BUILD=1 swift package dump-package > wasm.json
          python3 - <<'EOF'
          import json, os
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/"
          for name in ("linux", "android-arm64-v8a", "android-x86_64", "wasm"):
              manifest = json.load(open(f"{name}.json"))
              assert "unsafeFlags" not in json.dumps(manifest["targets"]), f"{name}: the release manifest has unsafeFlags"
              for dependency in manifest["dependencies"]:
                  for kind, (spec, *_) in dependency.items():
                      requirement = spec.get("requirement", {})
                      assert kind == "sourceControl" and ("range" in requirement or "exact" in requirement), \
                          f"{name}: {spec.get('identity')}: not depended on by version ({kind} {requirement})"
              # Every binary target is this release's archive: one left on
              # Artifacts/ (an archive name with no entry) would not exist
              # for a consumer.
              binaries = [t for t in manifest["targets"] if t["type"] == "binary"]
              assert binaries, f"{name}: no binary targets"
              for target in binaries:
                  assert (target.get("url") or "").startswith(base) and target.get("checksum"), \
                      f"{name}: binary target {target['name']} is not on the release: {target.get('url') or target.get('path')}"
              print(f"{name}: " + ", ".join(f"{t['name']} <- {t['url'].rsplit('/', 1)[1]}" for t in binaries))
          EOF
          rm *.json
      - name: Tag and publish
        run: |
          # Master as the run found it: the release commit goes on top of it,
          # so nothing is replaced or published if it moved meanwhile.
          git fetch -q origin master
          [ "$(git rev-parse origin/master)" = "$GITHUB_SHA" ] || {
            echo "::error::master moved during the run: run the release again on the new master"; exit 1; }
          # A re-release replaces the version's release and tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          git tag "$TAG"
          git push --force origin "refs/tags/$TAG"
          # A draft until every archive is up, so nobody resolves a release
          # that is missing one.
          gh release create "$TAG" dist/*.zip --verify-tag --draft --title "$TAG" \
            --notes "Prebuilt libraries for every platform; SwiftPM downloads the one it builds for."
          gh release edit "$TAG" --draft=false
          # Master builds from this release from now on. Refused if master
          # moved during the run: run the release again on the new master.
          git push origin HEAD:refs/heads/master

  verify:
    needs: release
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    steps:
      - name: Build a package that depends on the release
        run: |
          mkdir -p consumer/Sources/Consumer && cd consumer
          cat > Package.swift <<EOF
          // swift-tools-version: 6.2
          import PackageDescription

          let package = Package(
              name: "Consumer",
              platforms: [.macOS(.v14)],
              dependencies: [
                  .package(url: "https://github.com/$GITHUB_REPOSITORY", exact: "$TAG"),
              ],
              targets: [
                  .executableTarget(name: "Consumer", dependencies: [
                      .product(name: "NucleantVulkan", package: "NucleantVulkan"),
                  ]),
              ]
          )
          EOF
          cat > Sources/Consumer/main.swift <<'EOF'
          import NucleantVulkan

          print("NucleantVulkan resolved and linked")
          EOF
          swift build
          swift run Consumer
