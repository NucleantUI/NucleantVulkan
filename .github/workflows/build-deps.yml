# Builds NucleantVulkan's libraries for every platform from source, packages
# them as the archives its binary targets take, and builds and tests the
# package against them — one machine per platform, which builds, packages and
# tests:
#
#   apple    MoltenVK, MoltenVK_lib, wgpu_native, wgpu_native_framework,
#            shaderc, spirv-cross  (.xcframework.zip each)
#   linux    <library>-linux-<x86_64|aarch64>.artifactbundle.zip, a machine per
#            architecture:
#              vulkan-loader   libvulkan.so (the Khronos loader)
#              wgpu_native     libwgpu_native.so
#              shaderc         libshaderc_shared.so
#              spirv-cross     libspirv-cross-c-shared.so
#   windows  <library>-windows-x86_64.artifactbundle.zip, each the DLL with
#            its import library:
#              vulkan-loader   vulkan-1.dll (the Khronos loader)
#              wgpu_native     wgpu_native.dll
#              shaderc         shaderc_shared.dll
#              spirv-cross     spirv-cross-c-shared.dll
#   android  <library>-android-<arm64-v8a|x86_64>.artifactbundle.zip:
#              wgpu_native, shaderc, spirv-cross (shared, as on Linux)
#   wasm     <library>-wasm32.artifactbundle.zip:
#              shaderc (libshaderc_combined.a), spirv-cross (libspirv-cross.a)
#
# One archive per library, named after it, as the xcframeworks are.
#
# Apple: macOS and iOS (iPadOS) only, for now.
#
# Linux and Android keep their libraries shared inside the bundles (see
# scripts/make_artifactbundle.py). On Linux the bundle is everything an app
# needs but the GPU driver: no system Vulkan, shaderc or spirv-cross, and the
# Vulkan headers are vendored. Windows is the same, as DLLs: SwiftPM links each
# import library and copies the DLL next to the product.
#
# The archives are this run's artifacts ("vulkan-*"). Run it by hand to check
# that the dependencies still build; release.yml runs it for each release
# and attaches the archives to it.

name: build-deps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all, or one to retry)
        type: choice
        options: [all, apple, linux, windows, android, wasm]
        default: all
  workflow_call:
    inputs:
      version:
        description: Version written into the artifact bundles' info.json
        type: string
        default: 0.0.0

env:
  SWIFT_VERSION: 6.3.3
  VERSION: ${{ inputs.version || '0.0.0' }}
  # NucleantGeometry from GitHub; there is no sibling checkout here anyway.
  NUCLEANT_LOCAL_DEV: "0"
  # Package.swift takes the libraries from Artifacts/, where the tests put them.
  NUCLEANT_VULKAN_ARTIFACTS: "1"

jobs:
  apple:
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'apple'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: brew install ninja
      # Each library a step per architecture (or slice, or platform), then a
      # step that finds them all built and makes the xcframeworks.
      - name: wgpu-native macOS arm64
        run: python scripts/build_wgpu.py --apple-target aarch64-apple-darwin
      - name: wgpu-native macOS x86_64
        run: python scripts/build_wgpu.py --apple-target x86_64-apple-darwin
      - name: wgpu-native iOS arm64
        run: python scripts/build_wgpu.py --apple-target aarch64-apple-ios
      - name: wgpu-native iOS simulator arm64
        run: python scripts/build_wgpu.py --apple-target aarch64-apple-ios-sim
      - name: wgpu-native iOS simulator x86_64
        run: python scripts/build_wgpu.py --apple-target x86_64-apple-ios
      - name: wgpu-native xcframeworks
        run: python scripts/build_wgpu.py
      - name: shaderc + spirv-cross macOS (arm64 + x86_64)
        run: python scripts/build_shader_tools.py --apple --slice macos
      - name: shaderc + spirv-cross iOS arm64
        run: python scripts/build_shader_tools.py --apple --slice ios
      - name: shaderc + spirv-cross iOS simulator (arm64 + x86_64)
        run: python scripts/build_shader_tools.py --apple --slice ios-simulator
      - name: shaderc + spirv-cross xcframeworks
        run: python scripts/build_shader_tools.py --apple
      # MoltenVK: its dependencies for every platform first (each run of
      # fetchDependencies cleans MoltenVK), then MoltenVK per platform, each
      # adding its platform to the xcframework; the last step installs it.
      - name: MoltenVK dependencies macOS
        run: python scripts/build_vulkan.py --dependencies macos
      - name: MoltenVK dependencies iOS
        run: python scripts/build_vulkan.py --dependencies ios
      - name: MoltenVK dependencies iOS simulator
        run: python scripts/build_vulkan.py --dependencies iossim
      - name: MoltenVK macOS
        run: python scripts/build_vulkan.py --platform macos
      - name: MoltenVK iOS
        run: python scripts/build_vulkan.py --platform ios
      - name: MoltenVK iOS simulator
        run: python scripts/build_vulkan.py --platform iossim
      - name: MoltenVK xcframeworks
        run: |
          python scripts/build_vulkan.py --install-only
          # Every platform made it in: one slice each.
          plist=Dependencies/macos/MoltenVK.xcframework/Info.plist
          slices=$(plutil -extract AvailableLibraries raw "$plist")
          for i in $(seq 0 $((slices - 1))); do plutil -extract "AvailableLibraries.$i.LibraryIdentifier" raw "$plist"; done
          test "$slices" -eq 3
      - name: Package
        run: |
          mkdir -p dist
          for x in MoltenVK MoltenVK_lib wgpu_native wgpu_native_framework shaderc spirv-cross; do
            ditto -c -k --keepParent "Dependencies/macos/$x.xcframework" "dist/$x.xcframework.zip"
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: vulkan-apple
          path: dist/*.zip
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          curl -fsSLO "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/${release}/${release}-osx.pkg"
          installer -pkg "${release}-osx.pkg" -target CurrentUserHomeDirectory
          echo "$HOME/Library/Developer/Toolchains/${release}.xctoolchain/usr/bin" >> "$GITHUB_PATH"
      - name: Test against them
        run: |
          mkdir -p Artifacts && cp dist/*.zip Artifacts/
          swift test

  linux:
    name: linux (${{ matrix.arch }})
    # A machine per architecture: a Linux machine builds and tests its own.
    # In Swift's own image, which has the toolchain.
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      # What the libraries' builds take: wgpu-native's (Rust, linking with
      # cc; bindgen needs libclang), CMake for the loader, shaderc and
      # spirv-cross, the window systems' headers for the loader's WSI, and
      # patchelf. Only for building them: the package itself builds and links
      # against none of these. Not Ubuntu's clang package: it would replace
      # the image's Swift clang in /usr/bin.
      - name: System packages
        run: >
          apt-get update && apt-get install -y
          gcc g++ git curl python3 pkg-config libclang-dev cmake ninja-build patchelf
          libwayland-dev libxcb1-dev libx11-dev libx11-xcb-dev libxrandr-dev
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: wgpu-native ${{ matrix.arch }}
        run: |
          rm -rf Dependencies/linux/lib
          python3 scripts/build_wgpu.py --prefix Dependencies/linux
      - name: Vulkan loader ${{ matrix.arch }}
        run: python3 scripts/build_vulkan.py
      - name: shaderc + spirv-cross ${{ matrix.arch }}
        run: python3 scripts/build_shader_tools.py --linux
      - name: Package ${{ matrix.arch }}
        run: |
          lib=Dependencies/linux/lib
          for so in libvulkan.so libwgpu_native.so libshaderc_shared.so libspirv-cross-c-shared.so; do
            echo "$so: $(patchelf --print-soname $lib/$so 2>/dev/null) needs $(patchelf --print-needed $lib/$so | tr '\n' ' ')"
          done
          for pair in vulkan-loader:libvulkan.so wgpu_native:libwgpu_native.so \
                      shaderc:libshaderc_shared.so spirv-cross:libspirv-cross-c-shared.so; do
            python3 scripts/make_artifactbundle.py --triple ${{ matrix.arch }}-unknown-linux-gnu \
              --library "$lib/${pair#*:}" \
              --name "${pair%%:*}-linux-${{ matrix.arch }}" --output dist --version "$VERSION"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: vulkan-linux-${{ matrix.arch }}
          path: dist/*.zip

  linux-test:
    name: linux test (${{ matrix.arch }})
    needs: linux
    # A fresh Swift image with nothing installed: the bundle alone has to
    # build and run the tests, as it has to on a user's machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vulkan-linux-${{ matrix.arch }}
          path: Artifacts
      - name: Test against it, ${{ matrix.arch }}
        run: swift test

  windows:
    name: windows (x86_64)
    # Native, with MSVC: CMake's Visual Studio generator and cargo's MSVC
    # target find the compiler themselves. x86_64 only, for now.
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      # bindgen (wgpu-native's build script) loads libclang from the image's
      # LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The sources and builds in a short path: MSBuild's intermediate
      # directories under shaderc's third_party run past MAX_PATH from the
      # workspace.
      - name: wgpu-native x86_64
        run: python scripts/build_wgpu.py --work-dir C:\w
      - name: Vulkan loader x86_64
        run: python scripts/build_vulkan.py --work-dir C:\w
      - name: shaderc + spirv-cross x86_64
        run: python scripts/build_shader_tools.py --work-dir C:\w
      - name: Package x86_64
        run: |
          $lib = "Dependencies/windows"
          foreach ($pair in "vulkan-loader:vulkan-1", "wgpu_native:wgpu_native",
                            "shaderc:shaderc_shared", "spirv-cross:spirv-cross-c-shared") {
            $name, $file = $pair -split ":"
            python scripts/make_artifactbundle.py --triple x86_64-unknown-windows-msvc `
              --library "$lib/lib/$file.lib" --dll "$lib/bin/$file.dll" `
              --name "$name-windows-x86_64" --output dist --version "$env:VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: vulkan-windows-x86_64
          path: dist/*.zip

  windows-test:
    name: windows test (x86_64)
    needs: windows
    # A fresh machine with nothing but Swift: the bundles alone have to build
    # and run the tests, as on Linux. It has no GPU, so Mesa's software Vulkan
    # driver (lavapipe) is the one the loader finds — for the engine test on a
    # Win32 window (Tests/NucleantVulkanTests/Win32EngineTests.swift).
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vulkan-windows-x86_64
          path: Artifacts
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
      - name: lavapipe
        run: |
          $version = "26.2.4"
          curl.exe -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          7z x mesa.7z -omesa x64/vulkan_lvp.dll x64/lvp_icd.x86_64.json -r | Out-Null
          $icd = (Resolve-Path mesa/x64/lvp_icd.x86_64.json).Path
          Get-Content $icd
          # Registered the way an installed driver is: the loader ignores
          # VK_DRIVER_FILES in an elevated process, which the runner's are.
          $drivers = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $drivers -Force | Out-Null
          New-ItemProperty -Path $drivers -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null
      - name: Test against them, x86_64
        run: swift test

  android:
    # Both ABIs on one machine, in Swift's image for the cross-compile after.
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - run: >
          apt-get update && apt-get install -y
          g++ curl unzip python3 cmake ninja-build pkg-config libclang-dev
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # NDK r28, as Skia's Android build.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false
      - run: echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - run: rm -rf Dependencies/android
      - name: wgpu-native arm64-v8a
        run: python3 scripts/build_wgpu.py --android --abis arm64-v8a
      - name: wgpu-native x86_64
        run: python3 scripts/build_wgpu.py --android --abis x86_64
      - name: shaderc + spirv-cross arm64-v8a
        run: python3 scripts/build_shader_tools.py --abis arm64-v8a
      - name: shaderc + spirv-cross x86_64
        run: python3 scripts/build_shader_tools.py --abis x86_64
      - name: Package arm64-v8a
        run: |
          for pair in wgpu_native:libwgpu_native.so shaderc:libshaderc_shared.so \
                      spirv-cross:libspirv-cross-c-shared.so; do
            python3 scripts/make_artifactbundle.py --triple aarch64-unknown-linux-android28 \
              --library "Dependencies/android/arm64-v8a/lib/${pair#*:}" \
              --name "${pair%%:*}-android-arm64-v8a" --output dist --version "$VERSION"
          done
      - name: Package x86_64
        run: |
          for pair in wgpu_native:libwgpu_native.so shaderc:libshaderc_shared.so \
                      spirv-cross:libspirv-cross-c-shared.so; do
            python3 scripts/make_artifactbundle.py --triple x86_64-unknown-linux-android28 \
              --library "Dependencies/android/x86_64/lib/${pair#*:}" \
              --name "${pair%%:*}-android-x86_64" --output dist --version "$VERSION"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: vulkan-android
          path: dist/*.zip
      - name: Swift's Android SDK
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/android-sdk/${release}/${release}_android.artifactbundle.tar.gz" \
            --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
          # Links the NDK's sysroot into the SDK.
          # Wherever SwiftPM put the bundle (not necessarily under $HOME in a container).
          setup=$(find / -path /proc -prune -o -path "*${release}_android.artifactbundle*" -name setup-android-sdk.sh -print 2>/dev/null | head -1)
          echo "setup script: $setup"
          if [ -z "$setup" ]; then
            find / -path /proc -prune -o -type d -name "${release}_android.artifactbundle" -print 2>/dev/null | head -1 | xargs -I{} find {} -maxdepth 3
            exit 1
          fi
          "$setup"
      # Cross-compiled: builds and links the tests, which no device runs here.
      # The test product, not every target: the RenderNodeBuilder plugin's
      # generator runs on the build machine and isn't built for Android.
      - run: mkdir -p Artifacts && cp dist/*.zip Artifacts/
      - name: Build against them, arm64-v8a
        env:
          ANDROID_BUILD: "1"
          SWIFT_ANDROID_ABI: arm64-v8a
        run: swift build --swift-sdk aarch64-unknown-linux-android28 --product NucleantVulkanPackageTests
      - name: Build against them, x86_64
        env:
          ANDROID_BUILD: "1"
          SWIFT_ANDROID_ABI: x86_64
        run: swift build --swift-sdk x86_64-unknown-linux-android28 --product NucleantVulkanPackageTests

  wasm:
    # build_shader_tools_wasm.py compiles with the clang of the swift.org
    # toolchain matching the wasm SDK, from ~/Library/Developer/Toolchains.
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'wasm'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Swift ${{ env.SWIFT_VERSION }} and its wasm SDK
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          curl -fsSLO "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/${release}/${release}-osx.pkg"
          installer -pkg "${release}-osx.pkg" -target CurrentUserHomeDirectory
          bin="$HOME/Library/Developer/Toolchains/${release}.xctoolchain/usr/bin"
          "$bin/swift" sdk install \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/${release}/${release}_wasm.artifactbundle.tar.gz" \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
          echo "TOOLCHAIN_BIN=$bin" >> "$GITHUB_ENV"
      - run: brew install ninja
      - name: shaderc and spirv-cross
        run: |
          rm -rf Dependencies/wasm
          python scripts/build_shader_tools_wasm.py
      - name: Package
        run: |
          lib=Dependencies/wasm/lib
          spirv_cross=$(ls $lib/libspirv-cross-*.a | paste -sd, -)
          python scripts/make_artifactbundle.py --triple wasm32-unknown-wasip1 \
            --library "$lib/libshaderc_combined.a" \
            --name shaderc-wasm32 --output dist --version "$VERSION"
          python scripts/make_artifactbundle.py --triple wasm32-unknown-wasip1 \
            --library "libspirv-cross.a=$spirv_cross" \
            --name spirv-cross-wasm32 --output dist --version "$VERSION" --ar "$TOOLCHAIN_BIN/llvm-ar"
      - uses: actions/upload-artifact@v7
        with:
          name: vulkan-wasm32
          path: dist/*.zip
      # In headless Chrome on the page's WebGPU.
      - name: Test against it
        run: |
          mkdir -p Artifacts && cp dist/*.zip Artifacts/
          python scripts/run_wasm_tests.py
